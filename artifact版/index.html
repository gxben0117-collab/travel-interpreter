<title>旅途口譯</title>
<style>
/* Layout: 面對面模式為全螢幕上下分割（上半旋轉180°給對方），其他功能為單欄手機頁 */
:root{
  --bg:#eef0f5; --surface:#ffffff; --ink:#191c27; --muted:#5b6274; --line:#d9dce6;
  --ja:#2c3b8f; --ko:#0d7466; --on-accent:#ffffff; --warn:#a4372b;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-big:"Noto Sans TC","Hiragino Sans","Apple SD Gothic Neo","Malgun Gothic","Yu Gothic",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131a; --surface:#1b1e29; --ink:#eceef5; --muted:#9ba2b4; --line:#2d3140;
  --ja:#9aa8ff; --ko:#55d3be; --on-accent:#0c0e15; --warn:#ff9a8c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11131a; --surface:#1b1e29; --ink:#eceef5; --muted:#9ba2b4; --line:#2d3140;
  --ja:#9aa8ff; --ko:#55d3be; --on-accent:#0c0e15; --warn:#ff9a8c; color-scheme:dark;
}
body{--accent:var(--ja);background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.55}
body[data-country="ja"]{--accent:var(--ja)}
body[data-country="ko"]{--accent:var(--ko)}
body.f2f-on{overflow:hidden}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:.04em}
h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.02em}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;font:inherit;color:var(--muted);padding:10px 4px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
button:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:12px}
.hint{font-size:13px;color:var(--muted);margin:0}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px}
.btn:disabled{opacity:.5;cursor:default}
.notice{font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.notice.err{color:var(--warn);border-color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.dir{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.dir .tag{color:var(--accent);font-weight:700}
.back{font-size:15px;margin:0}
h2{font-size:14px;letter-spacing:.06em;color:var(--muted);margin:6px 0 0;font-weight:700}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:11px 14px;cursor:pointer}
.item:first-child{border-top:0}
.item .zh{font-size:15px}
.item .fx{font-family:var(--font-big);font-size:17px;font-weight:700;color:var(--accent)}
.item .note{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.photo{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:14px;padding:22px 12px;background:var(--surface);cursor:pointer;font-weight:700;color:var(--accent);text-align:center}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.preview{max-height:220px;object-fit:contain;border-radius:10px;align-self:center}
.sos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sos div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sos b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.sos span{font-size:13px;color:var(--muted)}

/* 面對面模式 */
.f2f{position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1.2fr)}
.pane{display:flex;flex-direction:column;gap:8px;min-height:0;padding:14px 16px}
.them{transform:rotate(180deg);background:color-mix(in srgb,var(--accent) 9%,var(--surface));padding-bottom:calc(14px + env(safe-area-inset-top,0px))}
.me{border-top:3px solid var(--accent);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.who-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:var(--muted)}
.who-bar b{color:var(--accent)}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.msg .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.msg .t{font-family:var(--font-big);font-size:17px;line-height:1.4;word-break:break-word;color:var(--muted)}
.msg .sub{font-size:13px;color:var(--muted);word-break:break-word}
.msg .rd{font-family:var(--font-mono);font-size:13px;color:var(--muted);word-break:break-word}
.msg:first-child .t{font-size:clamp(24px,7.2vw,38px);font-weight:700;color:var(--ink)}
.msg:first-child .sub{font-size:15px;color:var(--accent);font-family:var(--font-big);font-weight:700}
.msg .tip{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;margin-top:4px}
.compose{display:flex;gap:8px;align-items:stretch}
.compose textarea{flex:1;min-width:0;min-height:52px;max-height:120px;resize:none;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.compose .btn.primary{padding:0 18px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools .btn{padding:6px 10px;font-size:14px}
.tools .seg button{padding:5px 11px;font-size:14px}
.status{font-size:14px;color:var(--muted);min-height:1.2em;margin:0}
.status.err{color:var(--warn)}

.overlay{position:fixed;inset:0;background:var(--surface);z-index:10;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));cursor:pointer;overflow:auto}
.overlay .big{font-family:var(--font-big);font-size:clamp(34px,10vw,72px);line-height:1.3;font-weight:700;margin:0;word-break:break-word;white-space:pre-line}
.overlay .small{font-size:17px;color:var(--muted);margin:0}
.overlay .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<!-- 面對面翻譯（預設畫面） -->
<section class="f2f" id="f2f" aria-label="面對面翻譯">
  <div class="pane them" id="paneThem">
    <div class="who-bar"><b id="themTitle">相手の画面</b><span id="themHint">話すと、ここに日本語で表示されます</span></div>
    <div class="log" id="logThem"></div>
  </div>
  <div class="pane me">
    <div class="who-bar"><b>我的畫面</b><span>上半部已倒過來給對方看</span></div>
    <div class="log" id="logMe"></div>
    <p class="status" id="fStatus"></p>
    <div class="compose">
      <textarea id="src" rows="2" placeholder="說中文或日文都可以（用鍵盤麥克風）"></textarea>
      <button type="button" class="btn primary" id="go">翻譯</button>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="旅行國家">
        <button type="button" data-c="ja" aria-pressed="true">日本</button>
        <button type="button" data-c="ko" aria-pressed="false">韓國</button>
      </div>
      <button type="button" class="btn" id="speak">朗讀</button>
      <button type="button" class="btn" id="reset">清空對話</button>
      <button type="button" class="btn" id="more">拍照・常用句</button>
    </div>
  </div>
</section>

<div class="wrap" id="main">
  <header>
    <h1>旅途口譯<small id="sub">中文 ⇄ 日文</small></h1>
    <div class="seg" role="group" aria-label="旅行國家">
      <button type="button" data-c="ja" aria-pressed="true">日本</button>
      <button type="button" data-c="ko" aria-pressed="false">韓國</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="t" aria-selected="false">面對面翻譯</button>
    <button type="button" role="tab" data-tab="p" aria-selected="true">拍照翻譯</button>
    <button type="button" role="tab" data-tab="q" aria-selected="false">常用句</button>
  </nav>

  <div id="avail" class="notice" hidden></div>

  <!-- 拍照 -->
  <section class="panel" id="tab-p">
    <label class="photo">
      <input type="file" id="pic" accept="image/jpeg,image/png,image/webp">
      <span>拍菜單、告示或商品標籤<br><span class="hint">也可以從相簿選照片</span></span>
    </label>
    <img id="prev" class="preview" alt="剛選的照片" hidden>
    <div id="pStatus" class="notice" hidden></div>
    <div id="pOut" class="panel" hidden>
      <article class="card"><div class="dir"><span class="tag" id="pKind"></span></div><p class="back" id="pSum"></p></article>
      <p class="hint">點一項，會顯示「我要這個」給店員看。</p>
      <div class="list" id="pList"></div>
    </div>
  </section>

  <!-- 常用句 -->
  <section class="panel" id="tab-q" hidden>
    <div class="chips" id="cats"></div>
    <p class="hint">點一句就會放大給對方看，不用網路也能用。</p>
    <div class="list" id="phr"></div>
    <h2>緊急電話</h2>
    <div class="sos" id="sos"></div>
  </section>

  <article class="card">
    <div class="dir"><span class="tag">讓對方用說的</span></div>
    <p class="back">手機的語音輸入會跟著鍵盤語言走。先在手機設定加入日文、韓文鍵盤，輪到對方說話時，按鍵盤上的地球鍵切換語言，再按麥克風。</p>
    <p class="hint">iPhone：設定 → 一般 → 鍵盤 → 鍵盤 → 新增鍵盤。Android（Gboard）：Gboard 設定 → 語言 → 新增鍵盤。</p>
  </article>
</div>

<div class="overlay" id="ov" hidden>
  <button type="button" class="btn close" id="ovClose">關閉</button>
  <p class="big" id="ovBig"></p>
  <p class="small" id="ovSmall"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const C = {
  ja:{name:"日本",lang:"日文",tts:"ja-JP",style:"禮貌的日文（です・ます體）",reading:"羅馬拼音（Hepburn）",
      themTitle:"相手の画面",themHint:"話した内容は、ここに日本語で表示されます",meLbl:"旅行者",themLbl:"あなた",
      intro:"こんにちは。翻訳アプリでお話しさせてください。話した内容は、この画面に日本語で表示されます。",
      want:"これをお願いします。",
      sos:[["110","警察"],["119","救護車・消防"],["050-3816-2787","訪日外國人旅遊熱線（24小時，有中文）"],["#7119","不確定要不要叫救護車時諮詢（部分地區）"]]},
  ko:{name:"韓國",lang:"韓文",tts:"ko-KR",style:"禮貌的韓文（해요體）",reading:"羅馬拼音（韓國文化觀光部式）",
      themTitle:"상대방 화면",themHint:"말씀하신 내용은 여기에 한국어로 나와요",meLbl:"여행자",themLbl:"나",
      intro:"안녕하세요. 번역 앱으로 대화해도 될까요? 말씀하신 내용은 이 화면에 한국어로 나와요.",
      want:"이거 주세요.",
      sos:[["112","警察"],["119","救護車・消防"],["1330","韓國旅遊諮詢熱線（24小時，有中文）"],["1345","外國人綜合服務中心"]]}
};
// 常用句：[中文, 日文, 日文拼音, 韓文, 韓文拼音]
const P = {
  "點餐":[
    ["請給我菜單。","メニューをください。","menyū o kudasai","메뉴판 주세요.","menyupan juseyo"],
    ["我要這個。","これをください。","kore o kudasai","이거 주세요.","igeo juseyo"],
    ["有中文菜單嗎？","中国語のメニューはありますか？","chūgokugo no menyū wa arimasu ka","중국어 메뉴 있어요?","jungugeo menyu isseoyo"],
    ["兩位。","二人です。","futari desu","두 명이에요.","du myeong-ieyo"],
    ["不要辣。","辛くしないでください。","karaku shinaide kudasai","안 맵게 해 주세요.","an maepge hae juseyo"],
    ["可以外帶嗎？","持ち帰りできますか？","mochikaeri dekimasu ka","포장돼요?","pojang dwaeyo"],
    ["請結帳。","お会計をお願いします。","okaikei o onegai shimasu","계산해 주세요.","gyesanhae juseyo"],
    ["可以刷卡嗎？","カードで払えますか？","kādo de haraemasu ka","카드 돼요?","kadeu dwaeyo"]
  ],
  "飲食禁忌":[
    ["我對花生過敏。","ピーナッツアレルギーがあります。","pīnattsu arerugī ga arimasu","땅콩 알레르기가 있어요.","ttangkong allereugiga isseoyo"],
    ["這個有放蝦嗎？","これにエビは入っていますか？","kore ni ebi wa haitte imasu ka","이거 새우 들어가요?","igeo saeu deureogayo"],
    ["我不吃牛肉。","牛肉が食べられません。","gyūniku ga taberaremasen","소고기를 못 먹어요.","sogogireul mot meogeoyo"],
    ["我吃素。","ベジタリアンです。","bejitarian desu","채식주의자예요.","chaesikjuuija-yeyo"]
  ],
  "交通問路":[
    ["車站在哪裡？","駅はどこですか？","eki wa doko desu ka","역이 어디예요?","yeogi eodiyeyo"],
    ["廁所在哪裡？","トイレはどこですか？","toire wa doko desu ka","화장실 어디예요?","hwajangsil eodiyeyo"],
    ["這班車會到這裡嗎？（指地圖）","これはここに行きますか？","kore wa koko ni ikimasu ka","이거 여기 가요?","igeo yeogi gayo"],
    ["請到這個地址。","この住所までお願いします。","kono jūsho made onegai shimasu","이 주소로 가 주세요.","i jusoro ga juseyo"],
    ["請幫我叫計程車。","タクシーを呼んでください。","takushī o yonde kudasai","택시 불러 주세요.","taeksi bulleo juseyo"]
  ],
  "購物":[
    ["多少錢？","いくらですか？","ikura desu ka","얼마예요?","eolmayeyo"],
    ["可以免稅嗎？","免税できますか？","menzei dekimasu ka","택스 리펀 돼요?","taekseu ripeon dwaeyo"],
    ["有其他尺寸嗎？","他のサイズはありますか？","hoka no saizu wa arimasu ka","다른 사이즈 있어요?","dareun saijeu isseoyo"],
    ["我只是看看。","見ているだけです。","mite iru dake desu","그냥 구경하는 거예요.","geunyang gugyeonghaneun geoyeyo"],
    ["請給我袋子。","袋をください。","fukuro o kudasai","봉투 주세요.","bongtu juseyo"]
  ],
  "住宿":[
    ["我要辦理入住。","チェックインをお願いします。","chekkuin o onegai shimasu","체크인할게요.","chekeuinhalgeyo"],
    ["可以寄放行李嗎？","荷物を預かってもらえますか？","nimotsu o azukatte moraemasu ka","짐 맡길 수 있어요?","jim matgil su isseoyo"],
    ["Wi-Fi 密碼是什麼？","Wi-Fiのパスワードは何ですか？","waifai no pasuwādo wa nan desu ka","와이파이 비밀번호가 뭐예요?","waipai bimilbeonhoga mwoyeyo"]
  ],
  "緊急":[
    ["請幫幫我。","助けてください。","tasukete kudasai","도와주세요.","dowajuseyo"],
    ["我身體不舒服。","気分が悪いです。","kibun ga warui desu","몸이 안 좋아요.","momi an joayo"],
    ["請叫救護車。","救急車を呼んでください。","kyūkyūsha o yonde kudasai","구급차 불러 주세요.","gugeupcha bulleo juseyo"],
    ["我的東西不見了。","物をなくしました。","mono o nakushimashita","물건을 잃어버렸어요.","mulgeoneul ireobeoryeosseoyo"],
    ["我不會說當地語言。","日本語が話せません。","nihongo ga hanasemasen","한국어를 못해요.","hangugeoreul motaeyo"]
  ]
};

const $ = id => document.getElementById(id);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
let country = store.get("country","ja"); if(!C[country]) country="ja";
let cat = "點餐";
let sample = null;
let ctl = null;
let msgs = []; // {who:"me"|"them", zh, fx, reading, tip}
const canSpeak = typeof speechSynthesis!=="undefined";

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function note(el,msg,err){el.hidden=!msg;el.textContent=msg||"";el.classList.toggle("err",!!err)}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

// --- 國家、畫面切換 ---
function setCountry(c){
  country=c; store.set("country",c);
  document.body.dataset.country=c;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===c));
  $("sub").textContent="中文 ⇄ "+C[c].lang;
  $("src").placeholder=`說中文或${C[c].lang}都可以（用鍵盤麥克風）`;
  $("themTitle").textContent=C[c].themTitle; $("themHint").textContent=C[c].themHint;
  msgs=store.get("conv_"+c,[]);
  renderConv(); renderPhrases(); renderSOS();
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setCountry(b.dataset.c));
function openF2F(on){
  $("f2f").hidden=!on; $("main").hidden=on;
  document.body.classList.toggle("f2f-on",on);
}
function showTab(k){
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===k));
  ["p","q"].forEach(t=>$("tab-"+t).hidden=t!==k);
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  if(b.dataset.tab==="t"){openF2F(true);return}
  showTab(b.dataset.tab);
});
$("more").onclick=()=>{openF2F(false);showTab("p");window.scrollTo(0,0)};

// --- 對話顯示 ---
function renderConv(){
  const c=C[country], them=$("logThem"), me=$("logMe");
  them.replaceChildren(); me.replaceChildren();
  if(!msgs.length){
    const a=el("div","msg");a.append(el("span","t",c.intro));them.append(a);
    const b=el("div","msg");
    b.append(el("span","t","手機平放在你們中間"),
      el("span","sub","上半部是倒過來給對方看的。點下方輸入框，用鍵盤麥克風說中文；輪到對方說話時，把鍵盤切到"+c.lang+"再按麥克風。"));
    me.append(b);
    return;
  }
  msgs.slice(0,8).forEach(m=>{
    // 對方畫面：一律顯示外文
    const t=el("button","msg");t.type="button";
    t.append(el("span","lbl",m.who==="me"?c.meLbl:c.themLbl), el("span","t",m.fx));
    t.onclick=()=>speak(m.fx);
    them.append(t);
    // 我的畫面：一律顯示中文
    const s=el("button","msg");s.type="button";
    s.append(el("span","lbl",m.who==="me"?"我說":"對方說"), el("span","t",m.zh));
    if(m.who==="me"){
      s.append(el("span","sub",m.fx));
      if(m.reading) s.append(el("span","rd",m.reading));
    }
    if(m.tip) s.append(el("span","tip",m.tip));
    s.onclick=()=>speak(m.fx);
    me.append(s);
  });
  them.scrollTop=0; me.scrollTop=0;
}
function pushMsg(m){msgs.unshift(m);msgs=msgs.slice(0,30);store.set("conv_"+country,msgs);renderConv()}
$("reset").onclick=()=>{msgs=[];store.set("conv_"+country,[]);renderConv()};

// --- 翻譯 ---
function buildPrompt(text){
  const c=C[country];
  return `你是台灣旅客在${c.name}旅行時，和當地人面對面溝通的口譯。先判斷「原文」是什麼語言，再翻譯：
- 原文是中文（繁體或簡體）：翻成${c.style}，用當地人在店家、車站實際會說的自然說法，不要逐字直譯。
- 原文是${c.lang}或其他外語：翻成台灣用語的繁體中文，口語自然。
原文來自語音輸入，可能有同音錯字或沒有標點，請依上下文理解。
只回傳一個 JSON 物件，不要任何其他文字：
{"from":"zh" 或 "${country}" 或 "other","text":"譯文","reading":"譯文是${c.lang}時，附整句${c.reading}；否則空字串","tip":"只有真的有幫助時，用一句繁體中文提醒旅客用法、禮節，或對方可能怎麼回答；否則空字串"}
原文：
"""
${text}
"""`;
}
function errCopy(code){
  return ({
    not_granted:"沒有允許這個頁面使用 Claude。重新整理頁面後，在跳出的視窗按允許。",
    sampling_disabled:"這個帳號目前不能使用 Claude 翻譯。常用句還是可以用。",
    rate_limited:"翻譯次數太密集或已達用量上限，稍等一下再試。",
    session_expired:"登入已過期，請重新登入 claude.ai。",
    refused:"這段內容沒辦法翻譯，換個說法再試一次。",
    invalid_json:"翻譯結果格式有問題，再按一次翻譯。",
    images_unavailable:"這個裝置目前不能傳照片給 Claude。",
    image_rejected:"這張照片沒辦法讀取，換一張 JPG 或 PNG 試試。",
  })[code]||"連線不穩，翻譯失敗。確認網路後再按一次。";
}
function fStatus(msg,err,busy){const s=$("fStatus");s.classList.toggle("err",!!err);s.replaceChildren();if(busy)s.append(el("span","spin"),document.createTextNode(" "));if(msg)s.append(msg)}
async function translate(){
  const text=$("src").value.trim();
  if(!text){toast("先輸入或說出要翻譯的內容");return}
  if(!sample){fStatus("這裡無法使用即時翻譯（要在 claude.ai 登入後開啟）。可以先用「常用句」。",true);return}
  ctl?.abort(); ctl=new AbortController();
  $("go").disabled=true; fStatus("翻譯中…",false,true);
  try{
    const r=await sample.json(buildPrompt(text),{modelTier:"quick",signal:ctl.signal});
    if(!r||typeof r.text!=="string"||!r.text.trim()) throw {code:"invalid_json"};
    const tip=String(r.tip||"");
    if(r.from==="zh") pushMsg({who:"me",zh:text,fx:r.text.trim(),reading:String(r.reading||""),tip});
    else pushMsg({who:"them",fx:text,zh:r.text.trim(),tip});
    $("src").value=""; fStatus("");
  }catch(e){
    if(e&&e.code==="cancelled"){fStatus("");return}
    fStatus(errCopy(e&&e.code),true);
  }finally{$("go").disabled=false}
}
$("go").onclick=translate;
$("src").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();translate()}});

// --- 朗讀、放大 ---
function speak(text){
  if(!canSpeak||!text)return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang=C[country].tts;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
  catch{toast("這台裝置無法朗讀")}
}
$("speak").hidden=!canSpeak;
$("speak").onclick=()=>{if(msgs[0])speak(msgs[0].fx);else toast("還沒有可以朗讀的內容")};
function openOverlay(big,small){$("ovBig").textContent=big;$("ovSmall").textContent=small||"";$("ov").hidden=false}
$("ov").onclick=()=>$("ov").hidden=true;

// --- 常用句 ---
function renderPhrases(){
  const cats=$("cats");cats.replaceChildren();
  Object.keys(P).forEach(k=>{const b=el("button",null,k);b.type="button";
    b.setAttribute("aria-pressed",k===cat);b.onclick=()=>{cat=k;renderPhrases()};cats.append(b)});
  const list=$("phr");list.replaceChildren();
  const ja=country==="ja";
  P[cat].forEach(p=>{
    const fx=ja?p[1]:p[3], rd=ja?p[2]:p[4];
    const b=el("button","item");b.type="button";
    b.append(el("span","zh",p[0]),el("span","fx",fx),el("span","note",rd));
    b.onclick=()=>{openOverlay(fx,p[0]);speak(fx)};
    list.append(b);
  });
}
function renderSOS(){
  const s=$("sos");s.replaceChildren();
  C[country].sos.forEach(([n,l])=>{const d=el("div");d.append(el("b",null,n),el("span",null,l));s.append(d)});
}

// --- 拍照翻譯 ---
$("pic").onchange=async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  $("prev").src=URL.createObjectURL(f);$("prev").hidden=false;$("pOut").hidden=true;
  if(!sample){note($("pStatus"),"這裡無法使用拍照翻譯（要在 claude.ai 登入後開啟）。",true);return}
  $("pStatus").hidden=false;$("pStatus").classList.remove("err");
  $("pStatus").replaceChildren(el("span","spin"),document.createTextNode(" 讀取照片中，約 10～30 秒…"));
  const c=C[country];
  const prompt=`這是台灣旅客在${c.name}拍的照片，可能是菜單、告示、商品標籤或票券。請用台灣用語的繁體中文說明。
只回傳一個 JSON 物件，不要其他文字：
{"kind":"菜單、告示、商品或其他","summary":"一兩句話說明這是什麼、旅客該注意什麼","items":[{"original":"照片上的原文","zh":"中文翻譯","note":"簡短補充，例如主要食材、價格、辣度、常見過敏原（蝦、蛋、花生、小麥等）、使用規則；沒有就空字串"}]}
items 依照片上的順序列出，最多 30 項；看不清楚的字不要猜。`;
  try{
    const r=await sample.json(prompt,{images:f});
    $("pKind").textContent=r.kind||"照片";$("pSum").textContent=r.summary||"";
    const list=$("pList");list.replaceChildren();
    (Array.isArray(r.items)?r.items:[]).forEach(it=>{
      const b=el("button","item");b.type="button";
      b.append(el("span","zh",String(it.zh||"")),el("span","fx",String(it.original||"")));
      if(it.note)b.append(el("span","note",String(it.note)));
      b.onclick=()=>openOverlay(String(it.original||"")+"\n"+c.want,"我要這個："+String(it.zh||""));
      list.append(b);
    });
    list.hidden=!list.children.length;
    $("pOut").hidden=false; note($("pStatus"),"");
  }catch(err){note($("pStatus"),errCopy(err&&err.code),true)}
  finally{e.target.value=""}
};

// --- 啟動 ---
setCountry(country);
openF2F(true);
(async()=>{
  try{sample=window.claude?await window.claude.use("sample"):null}catch{sample=null}
  if(!sample){
    note($("avail"),"目前在 claude.ai 以外開啟，即時翻譯和拍照翻譯無法使用；常用句可以照常使用。");
    fStatus("目前在 claude.ai 以外開啟，即時翻譯無法使用。",true);
  }
})();
</script>
